services:
  app:
    build: .
    image: chain-audit:latest
    container_name: chain-audit
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - audit-data:/data
    # Container listens on 8000; published on the host's loopback only. Point the reverse proxy at 127.0.0.1:${APP_PORT}.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    # Resource caps: one uvicorn worker + SQLite for a ~9-person team needs well under these.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "1.0"
    pids_limit: 200
    # Hardening: no privileges needed. Only /data (volume) and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  audit-data:
