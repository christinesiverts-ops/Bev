{% extends "base.html" %}{% block title %}New follow-up{% endblock %}{% block main %}page-narrow{% endblock %}
{% block content %}
<h1 class="mb-4">New follow-up</h1>
<form method="post" class="card-pad">{{ csrf_field() }}
  <label class="field"><span class="label">Store</span><select class="input" name="store_id" required><option value="">Pick…</option>
    {% for st in stores %}<option value="{{ st.id }}" {% if st.id == store_id %}selected{% endif %}>{{ st.label }}</option>{% endfor %}</select></label>
  <label class="field"><span class="label">Program (optional)</span><select class="input" name="program_id"><option value="">—</option>
    {% for p in progs %}<option value="{{ p.id }}">{{ p.code }}</option>{% endfor %}</select></label>
  <div class="form-grid">
    <label class="field"><span class="label">Type</span><select class="input" name="discrepancy_type">{% for d_ in dtypes %}<option>{{ d_ }}</option>{% endfor %}</select></label>
    <label class="field"><span class="label">Owner</span><select class="input" name="owner_id">{% for u in team %}<option value="{{ u.id }}">{{ u.display_name }}</option>{% endfor %}</select></label>
    <label class="field"><span class="label">Due</span><input class="input" type="date" name="due_date"></label>
  </div>
  <label class="field"><span class="label">Description</span><textarea class="input" name="description" rows="3" required></textarea></label>
  <label class="field"><span class="label">Action needed</span><input class="input" name="action"></label>
  <button class="btn btn-primary btn-lg" data-loading="Creating…">Create follow-up</button>
</form>
{% endblock %}
